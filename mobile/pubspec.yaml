name: car_app
description: A guest-friendly car maintenance and assistance app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  uuid: ^4.6.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  image_picker: ^1.2.1
  flutter_html: ^3.0.0
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  # flutter_html 3.0.0 uses matches(), removed in html 0.15.7.
  html: 0.15.6
  flutter_secure_storage: ^11.2.0
  model_viewer_plus: ^1.10.0
  supabase_flutter: 2.18.3
  flutter_svg: 2.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/corolla.glb
    - assets/images/branding/
    - assets/images/mascots/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
