name: car_app
description: A guest-friendly car maintenance and assistance app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  image_picker: ^1.2.1
  flutter_html: ^3.0.0
  # flutter_html 3.0.0 uses matches(), removed in html 0.15.7.
  html: 0.15.6
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/emergency/guides.json
